services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-scheduler-web
    command: python -m app_scheduler.web
    env_file:
      - .env.docker
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      TZ: America/Santiago
      RUTA_CONTROL_RUNTIME: /app/runtime_control
    ports:
      - "5000:5000"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:5000/salud"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./logs:/app/logs
      - ./logs_tareas:/app/logs_tareas
      - ./logs_sistema:/app/logs_sistema
      - ./scripts:/app/scripts
      - ./env_scripts:/app/env_scripts
      - ./runtime_control:/app/runtime_control

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-scheduler-worker
    command: python -m app_scheduler.worker.aplicacion
    env_file:
      - .env.docker
    environment:
      TZ: America/Santiago
      RUTA_CONTROL_RUNTIME: /app/runtime_control
      APP_SECRET_KEY: ""
      USUARIO_ADMIN_DEFECTO: ""
      PASSWORD_ADMIN_DEFECTO: ""
      FACTORY_RESET_HABILITADO: "false"
      FACTORY_RESET_DB_SERVER: ""
      FACTORY_RESET_DB_USER: ""
      FACTORY_RESET_DB_PASSWORD: ""
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "app_scheduler.worker.aplicacion", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    volumes:
      - ./logs:/app/logs
      - ./logs_tareas:/app/logs_tareas
      - ./logs_sistema:/app/logs_sistema
      - ./scripts:/app/scripts
      - ./env_scripts:/app/env_scripts
      - ./runtime_control:/app/runtime_control
